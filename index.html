<style>
:root{
  --restaurant-photo:url("assets/fondo.webp");
  --text:#ffffff;
  --muted:#c8c8cf;
  --yellow:#ffd331;
  --cyan:#1cc8d0;
  --magenta:#7d47ff;
  --shadow:0 22px 55px rgba(0,0,0,.42);
  --radius:28px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:
  radial-gradient(circle at top left, rgba(28,200,208,.16), transparent 24%),
  radial-gradient(circle at top right, rgba(255,211,49,.13), transparent 20%),
  radial-gradient(circle at 50% 0%, rgba(125,71,255,.12), transparent 30%),
  linear-gradient(180deg,#080808 0%,#0f0f10 100%);
}
body{
  margin:0;color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;overflow-x:hidden;background:transparent;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.6;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:22px 22px;
  mask-image:linear-gradient(180deg, transparent, black 18%, black 82%, transparent);
}
.shell{width:100%;max-width:920px;margin:0 auto;padding:4px 4px 88px;}
.menu{
  display:flex;
  gap:14px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  padding:2px 2px 8px;
  touch-action:pan-x;
}
.menu::-webkit-scrollbar{display:none}
.menu{scrollbar-width:none}
.carousel-shell{
  position:relative;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding:6px 0 10px;
}
.carousel-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:10px 0 0;
}
.nav-arrow{
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.05);
  color:#fff;font-size:24px;cursor:pointer;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
  display:grid;place-items:center;
}
.nav-arrow:active{transform:scale(.98)}
.slide-pill{
  min-width:142px;
  padding:11px 16px;
  text-align:center;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.52);
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.03em;
  box-shadow:var(--shadow);
}
.slide-pill b{color:var(--yellow)}
.page{
  scroll-snap-align:center;
  scroll-snap-stop:always;
  flex:0 0 100%;
  width:100%;
  min-width:100%;
  perspective:1200px;
  padding:2px 0;
}
.page-frame{
  position:relative;width:100%;overflow:hidden;border-radius:22px;padding:7px;
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);
  transform-origin:left center;
  transform:rotateY(10deg) scale(.97);
  opacity:.72;
  transition:transform .45s ease, opacity .35s ease, box-shadow .35s ease;
}
.page-frame::before{content:"";position:absolute;inset:7px;border-radius:17px;pointer-events:none;border:1px solid rgba(255,255,255,.05);}
.page-ribbon{position:absolute;top:18px;left:20px;z-index:3;display:grid;place-items:center;min-width:52px;height:34px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.58);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);color:var(--yellow);font-weight:900;letter-spacing:.08em;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.menu-page{display:block;width:100%;max-width:100%;height:auto;border-radius:16px;cursor:default;user-select:none;-webkit-user-drag:none;touch-action:pan-x;image-rendering:auto;filter:none}
.counter{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));z-index:72;padding:11px 14px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.10);font-size:12px;font-weight:800;letter-spacing:.03em;box-shadow:var(--shadow);pointer-events:none;}
.counter b{color:var(--yellow)}
.fab{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  z-index:80;
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  cursor:pointer;
  background:linear-gradient(135deg,#0fa79f 0%, #17c7bf 55%, #25d1c6 100%);
  color:#fff;
  font-size:25px;
  box-shadow:0 12px 28px rgba(0,0,0,.38);
  display:grid;
  place-items:center;
}
.backdrop{position:fixed;inset:0;z-index:140;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .24s ease}
.backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;z-index:150;width:min(390px,92vw);height:100dvh;background:linear-gradient(180deg,#0f1012 0%, #111214 100%);border-left:1px solid rgba(255,255,255,.09);transform:translateX(102%);transition:transform .24s ease;box-shadow:-30px 0 50px rgba(0,0,0,.52);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:10px 12px 2px;
  border-bottom:none;
  background:transparent;
}
.close{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.04);
  color:#fff;
  font-size:26px;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.22);
}
.search{padding:14px 16px 10px}
.search input{width:100%;padding:14px 15px;border-radius:16px;outline:none;color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(28,200,208,.12)}
.cats{overflow:auto;padding:4px 12px 24px;display:grid;gap:8px}
.cat{width:100%;display:grid;grid-template-columns:48px 1fr;align-items:center;gap:12px;text-align:left;cursor:pointer;padding:12px 10px;border-radius:18px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:#fff;}
.cat span{display:grid;place-items:center;height:36px;border-radius:12px;background:rgba(255,255,255,.07);font-weight:900;color:var(--yellow)}
.cat strong{display:block;font-size:14px}
.cat small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.cat:hover,.cat.active{background:rgba(255,255,255,.08);border-color:rgba(255,211,49,.28)}
.cat.active span{background:var(--yellow);color:#111}
.page.active .page-frame{
  transform:rotateY(0deg) scale(1);
  opacity:1;
  box-shadow:0 26px 62px rgba(0,0,0,.48);
}
.page.active .page-ribbon{
  border-color:rgba(255,211,49,.24);
}
.reveal{opacity:1;transform:none;transition:none}
@media (max-width:640px){
  .shell{padding:2px 2px 82px}
  .menu{gap:10px}
  .page-frame{padding:4px;border-radius:18px}
  .page-frame::before{inset:4px;border-radius:14px}
  .menu-page{border-radius:13px}
  .page-ribbon{top:10px;left:11px;min-width:42px;height:29px;padding:0 10px;font-size:11px}
  .counter{max-width:calc(100vw - 92px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .carousel-shell{padding:4px 0 8px}
  .carousel-controls{gap:10px;margin-top:6px}
  .nav-arrow{width:46px;height:46px}
  .slide-pill{min-width:126px;padding:10px 14px;font-size:11px}
}
@media (min-width:641px) and (max-width:1024px){
  .shell{max-width:860px;padding:8px 10px 96px}
  .menu{gap:14px}
  .page-frame{padding:9px;border-radius:24px}
  .menu-page{border-radius:18px}
}
@media (min-width:1025px){
  .shell{max-width:940px;padding:12px 18px 100px}
  .menu{gap:18px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .backdrop,.drawer,.page-frame{transition:none}
}
body,button,input{touch-action:manipulation}
img{max-width:100%}


.intro{
  position:fixed;inset:0;z-index:250;
  display:grid;place-items:center;
  padding:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 28%, rgba(28,200,208,.17), transparent 28%),
    radial-gradient(circle at 50% 78%, rgba(125,71,255,.16), transparent 34%),
    linear-gradient(180deg,#050607 0%,#090a0c 55%,#08080b 100%);
  transition:opacity .36s ease,visibility .36s ease;
}
.intro::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.38;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,transparent 0%,black 20%,black 80%,transparent 100%);
}
.intro::after{
  content:"";position:absolute;left:50%;top:50%;
  width:min(92vw,520px);height:min(92vw,520px);
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,211,49,.10),rgba(28,200,208,.07) 32%,transparent 68%);
  filter:blur(10px);
  animation:introAura 2.35s ease both;
  pointer-events:none;
}
.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}

.intro-stage{
  position:relative;z-index:2;
  width:min(92vw,500px);
  min-height:min(78vh,720px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  transform:translateY(-1vh);
}
.intro-logo-wrap{
  position:relative;
  width:min(78vw,360px);
  padding:8px;
  animation:introLogoIn 1.65s cubic-bezier(.16,1,.3,1) both;
}
.intro-logo-wrap::before{
  content:"";position:absolute;inset:12% 8%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(28,200,208,.18),transparent 66%);
  filter:blur(22px);
  z-index:-1;
}
.intro-logo{
  display:block;width:100%;height:auto;margin:0 auto;background:transparent;mix-blend-mode:normal;
  filter:drop-shadow(0 18px 32px rgba(0,0,0,.45));
}
.intro-separator{
  width:min(54vw,230px);height:1px;margin:26px auto 18px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.48),transparent);
  transform-origin:center;
  animation:introLine 1.2s .48s ease both;
}
.intro-title{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(42px,12vw,74px);
  font-weight:600;
  line-height:.95;
  letter-spacing:.16em;
  padding-left:.16em;
  color:#fff;
  text-shadow:0 10px 28px rgba(0,0,0,.42);
  animation:introTitleIn 1.05s .58s cubic-bezier(.16,1,.3,1) both;
}
.intro-title span{
  background:linear-gradient(180deg,#fff8d8 0%,#ffd84f 54%,#dcae16 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

body.intro-playing{overflow:hidden}
body.intro-playing .shell,
body.intro-playing .fab,
body.intro-playing .carousel-controls{
  opacity:0;transform:translateY(10px);pointer-events:none;
}
.shell,.fab,.carousel-controls{
  transition:opacity .55s ease,transform .55s ease;
}
body.intro-done .shell,
body.intro-done .fab,
body.intro-done .carousel-controls{
  opacity:1;transform:none;pointer-events:auto;
}

@keyframes introLogoIn{
  0%{opacity:0;transform:scale(.72) translateY(22px)}
  58%{opacity:1;transform:scale(1.045) translateY(0)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes introTitleIn{
  from{opacity:0;transform:translateY(18px) scale(.96)}
  to{opacity:1;transform:none}
}
@keyframes introLine{
  from{opacity:0;transform:scaleX(.1)}
  to{opacity:1;transform:scaleX(1)}
}
@keyframes introAura{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@media (max-width:640px){
  .intro-stage{min-height:76vh}
  .intro-logo-wrap{width:min(86vw,390px)}
  .intro-separator{margin-top:22px}
  .intro-title{font-size:clamp(40px,13vw,62px)}
}
@media (prefers-reduced-motion:reduce){
  .intro::after,.intro-logo-wrap,.intro-separator,.intro-title{animation:none}
}

/* Interacción más fluida y sin realce verde en móvil */
*{
  -webkit-tap-highlight-color: transparent;
}
button,
a,
input,
select,
textarea{
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
button:focus,
button:focus-visible,
a:focus,
a:focus-visible,
input:focus,
input:focus-visible,
select:focus,
select:focus-visible,
textarea:focus,
textarea:focus-visible{
  outline:none !important;
  box-shadow:none !important;
}
button::-moz-focus-inner{
  border:0;
}
.nav-arrow,
.fab,
.cat,
.close,
.google-review-btn{
  transition:
    transform .18s ease,
    background .22s ease,
    border-color .22s ease,
    box-shadow .22s ease,
    opacity .22s ease;
  will-change: transform;
}
.nav-arrow:hover,
.fab:hover,
.close:hover{
  border-color:rgba(255,255,255,.18);
  box-shadow:0 18px 38px rgba(0,0,0,.38);
  filter:saturate(1.05);
}
.nav-arrow:active,
.close:active,
.cat:active,
.google-review-btn:active{
  transform:scale(.965);
}
.fab:active{
  transform:translateY(-50%) scale(.965);
}
.nav-arrow{
  user-select:none;
}
.nav-arrow[disabled]{
  cursor:default;
  transform:none !important;
}
.cat{
  user-select:none;
}
.menu{
  scroll-behavior:smooth;
  scroll-snap-type:x mandatory;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;

.page-frame{

/* =========================================================
   AJUSTE FINAL MOBILE-FIRST

  max-width:100%;

body{

}

.shell{

  max-width:940px !important;

.carousel-shell{

  position:absolute;
  left:50%;
  top:50%;
  width:min(76vw,390px);
  height:min(76vw,390px);
  transform:translate(-50%,-45%) scale(.72);
  border-radius:50%;
  border:1px solid rgba(255,211,105,.08);
  opacity:0;
  pointer-events:none;
  animation:introFinalHalo .9s 2.05s ease-out forwards;
}

@keyframes introLetterSettle{
  0%{opacity:0;transform:translateY(-42px) scale(.82) rotate(var(--tilt,0deg))}
  70%{opacity:1;transform:translateY(4px) scale(1.035) rotate(0deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
}
@keyframes introGoldLine{
  0%{opacity:0;transform:scaleX(.08)}
  100%{opacity:1;transform:scaleX(1)}
}
@keyframes introLogoSettle{
  0%{opacity:0;transform:translateY(34px) scale(.82) rotate(-4deg)}
  68%{opacity:1;transform:translateY(-4px) scale(1.025) rotate(.7deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
}
@keyframes introProvechoIn{
  0%{opacity:0;transform:translateY(24px) scale(.94)}
  72%{opacity:1;transform:translateY(-2px) scale(1.02)}
  100%{opacity:1;transform:translateY(0) scale(1)}

// puede descargarlas durante la bienvenida. Solo conservamos la precarga cercana.
const hydrationDelay=Math.max(0,800-(performance.now()-(window.__laChonaIntroStart||performance.now())));
setTimeout(()=>loadNearbyImages(0),hydrationDelay);

function setDrawer(v){
  drawer.classList.toggle('open',v);
  backdrop.classList.toggle('open',v);
  document.body.style.overflow=v?'hidden':'';
}
openMenu.onclick=()=>setDrawer(true);
closeMenu.onclick=()=>setDrawer(false);
backdrop.onclick=()=>setDrawer(false);

function updateUI(index){
  loadNearbyImages(index);
  currentIndex=index;
  const page=pages[index];
  const title=page.dataset.title;
  const pageNum=String(index+1).padStart(2,'0');
  slidePill.innerHTML=`<b>${pageNum}</b> / 17`;
  cats.forEach((b,n)=>b.classList.toggle('active',n===index));
  pages.forEach((p,n)=>p.classList.toggle('active',n===index));
  prevPage.disabled=index===0;
  nextPage.disabled=index===pages.length-1;
  prevPage.style.opacity=index===0?'.45':'1';
  nextPage.style.opacity=index===pages.length-1?'.45':'1';
}

let isAnimating=false;
let buttonScrollRAF=0;

function glideTo(left,index){
  cancelAnimationFrame(buttonScrollRAF);

  const start=menu.scrollLeft;
  const distance=left-start;

  // Movimiento más rápido, pero conservando la desaceleración tipo swipe.
  const duration=Math.min(270,Math.max(190,Math.abs(distance)*0.24));
  const startTime=performance.now();

  isAnimating=true;
  menu.classList.add('button-glide');

  function frame(now){
    const t=Math.min(1,(now-startTime)/duration);

    // Desaceleración rápida y natural, similar a un swipe corto.
    const eased=1-Math.pow(1-t,3.4);
    menu.scrollLeft=start+(distance*eased);

    if(t<1){
      buttonScrollRAF=requestAnimationFrame(frame);
    }else{
      menu.scrollLeft=left;
      menu.classList.remove('button-glide');
      isAnimating=false;
      updateUI(index);
    }
  }

  buttonScrollRAF=requestAnimationFrame(frame);
}

function goToIndex(index, smooth=true){
  index=Math.max(0,Math.min(pages.length-1,index));
  loadNearbyImages(index);

  const targetPage=pages[index];
  const targetLeft=targetPage.offsetLeft - ((menu.clientWidth - targetPage.clientWidth) / 2);

  if(isAnimating && smooth) return;

  if(smooth){
    glideTo(targetLeft,index);
  }else{
    cancelAnimationFrame(buttonScrollRAF);
    menu.classList.remove('button-glide');
    menu.scrollTo({left:targetLeft,behavior:'auto'});
    updateUI(index);
  }
}

cats.forEach((b,idx)=>b.onclick=()=>{
  setDrawer(false);
  goToIndex(idx,true);
});

prevPage.onclick=()=>goToIndex(currentIndex-1,true);
nextPage.onclick=()=>goToIndex(currentIndex+1,true);

let scrollTimer;
menu.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const menuRect=menu.getBoundingClientRect();
    const center=menuRect.left + menuRect.width/2;
    let bestIndex=0;
    let bestDistance=Infinity;
    pages.forEach((page,idx)=>{
      const r=page.getBoundingClientRect();
      const pageCenter=r.left + r.width/2;
      const d=Math.abs(center-pageCenter);
      if(d<bestDistance){bestDistance=d; bestIndex=idx;}
    });
    updateUI(bestIndex);
  },90);
},{passive:true});

const s=document.getElementById('catSearch');
s.oninput=()=>{
  const q=s.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  cats.forEach(b=>{
    const t=b.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    b.style.display=t.includes(q)?'grid':'none';
  });
};

requestAnimationFrame(()=>setTimeout(()=>goToIndex(0,false),30));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') setDrawer(false);
  if(e.key==='ArrowRight') goToIndex(currentIndex+1,true);
  if(e.key==='ArrowLeft') goToIndex(currentIndex-1,true);
});

// Autoajuste de la hoja al espacio REAL disponible de cada pantalla.
// Conserva la proporción original y solo reduce tamaño si hace falta.
function fitMenuToViewport(){
  const firstImg = document.querySelector('.menu-page');
  if(!firstImg || !menu) return;

  const applyFit = () => {
    const menuRect = menu.getBoundingClientRect();
    if(menuRect.width < 50 || menuRect.height < 50) return;

    // Todas las hojas de la carta usan la proporción 1087 × 1536.
    // No usamos la proporción natural de la primera imagen (17.webp),
    // porque si esa portada tiene otra medida, encoge visualmente las demás hojas.
    const ratio = 1087 / 1536;

    const maxW = Math.max(120, menuRect.width - 6);
    const maxH = Math.max(120, menuRect.height - 4);

    let w = maxW;
    let h = w / ratio;

    if(h > maxH){
      h = maxH;
      w = h * ratio;
    }

    document.documentElement.style.setProperty('--page-w', `${Math.floor(w)}px`);
    document.documentElement.style.setProperty('--page-h', `${Math.floor(h)}px`);

    requestAnimationFrame(() => {
      const targetPage = pages[currentIndex];
      if(targetPage){
        const targetLeft =
          targetPage.offsetLeft -
          ((menu.clientWidth - targetPage.clientWidth) / 2);
        menu.scrollTo({left:targetLeft, behavior:'auto'});
      }
    });
  };

  if(firstImg.complete){
    applyFit();
  }else{
    firstImg.addEventListener('load', applyFit, {once:true});
  }
}

let fitTimer;
function scheduleFit(){
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitMenuToViewport, 80);
}

requestAnimationFrame(()=>setTimeout(fitMenuToViewport,40));
window.addEventListener('load', () => {
  setTimeout(fitMenuToViewport, 80);
  setTimeout(fitMenuToViewport, 350);
});
window.addEventListener('resize', scheduleFit, {passive:true});
window.addEventListener('orientationchange', () => setTimeout(fitMenuToViewport, 180));

if(window.visualViewport){
  window.visualViewport.addEventListener('resize', scheduleFit, {passive:true});
}

// Bloquear zoom accidental en móviles/tablets y Ctrl+rueda en escritorio.
document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
document.addEventListener('wheel', e => {
  if(e.ctrlKey) e.preventDefault();
}, {passive:false});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && ['+','-','=','0'].includes(e.key)){
    e.preventDefault();
  }
});

</script>
