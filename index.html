  --text:#ffffff;
  --muted:#c8c8cf;
  --yellow:#ffd331;
  --cyan:#1cc8d0;
  --magenta:#7d47ff;
  --shadow:0 22px 55px rgba(0,0,0,.42);
  --radius:28px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:
  radial-gradient(circle at top left, rgba(28,200,208,.16), transparent 24%),
  radial-gradient(circle at top right, rgba(255,211,49,.13), transparent 20%),
  radial-gradient(circle at 50% 0%, rgba(125,71,255,.12), transparent 30%),
  linear-gradient(180deg,#080808 0%,#0f0f10 100%);
}
body{
  margin:0;color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;overflow-x:hidden;background:transparent;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.6;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:22px 22px;
  mask-image:linear-gradient(180deg, transparent, black 18%, black 82%, transparent);
}
.shell{width:100%;max-width:920px;margin:0 auto;padding:4px 4px 88px;}
.menu{
  display:flex;
  gap:14px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  padding:2px 2px 8px;
  touch-action:pan-x;
}
.menu::-webkit-scrollbar{display:none}
.menu{scrollbar-width:none}
.carousel-shell{
  position:relative;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  padding:6px 0 10px;
}
.carousel-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:10px 0 0;
}
.nav-arrow{
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.05);
  color:#fff;font-size:24px;cursor:pointer;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
  display:grid;place-items:center;
}
.nav-arrow:active{transform:scale(.98)}
.slide-pill{
  min-width:142px;
  padding:11px 16px;
  text-align:center;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.52);
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.03em;
  box-shadow:var(--shadow);
}
.slide-pill b{color:var(--yellow)}
.page{
  scroll-snap-align:center;
  scroll-snap-stop:always;
  flex:0 0 100%;
  width:100%;
  min-width:100%;
  perspective:1200px;
  padding:2px 0;
}
.page-frame{
  position:relative;width:100%;overflow:hidden;border-radius:22px;padding:7px;
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);
  transform-origin:left center;
  transform:rotateY(10deg) scale(.97);
  opacity:.72;
  transition:transform .45s ease, opacity .35s ease, box-shadow .35s ease;
}
.page-frame::before{content:"";position:absolute;inset:7px;border-radius:17px;pointer-events:none;border:1px solid rgba(255,255,255,.05);}
.page-ribbon{position:absolute;top:18px;left:20px;z-index:3;display:grid;place-items:center;min-width:52px;height:34px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.58);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);color:var(--yellow);font-weight:900;letter-spacing:.08em;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.menu-page{display:block;width:100%;max-width:100%;height:auto;border-radius:16px;cursor:default;user-select:none;-webkit-user-drag:none;touch-action:pan-x;image-rendering:auto;filter:none}
.counter{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));z-index:72;padding:11px 14px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.10);font-size:12px;font-weight:800;letter-spacing:.03em;box-shadow:var(--shadow);pointer-events:none;}
.counter b{color:var(--yellow)}
.fab{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  z-index:80;
  width:52px;
  height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);

.intro{
  position:fixed;inset:0;z-index:250;
  display:grid;place-items:center;
  padding:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 28%, rgba(28,200,208,.17), transparent 28%),
    radial-gradient(circle at 50% 78%, rgba(125,71,255,.16), transparent 34%),
    linear-gradient(180deg,#050607 0%,#090a0c 55%,#08080b 100%);
  transition:opacity .36s ease,visibility .36s ease;
}
.intro::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.38;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,transparent 0%,black 20%,black 80%,transparent 100%);
}
.intro::after{
  content:"";position:absolute;left:50%;top:50%;
  width:min(92vw,520px);height:min(92vw,520px);
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,211,49,.10),rgba(28,200,208,.07) 32%,transparent 68%);
  filter:blur(10px);
  animation:introAura 2.35s ease both;
  pointer-events:none;
}
.intro.hidden{opacity:0;visibility:hidden;pointer-events:none}

.intro-stage{
  position:relative;z-index:2;
  width:min(92vw,500px);
  min-height:min(78vh,720px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  transform:translateY(-1vh);
}
.intro-logo-wrap{
  position:relative;
  width:min(78vw,360px);
  padding:8px;
  animation:introLogoIn 1.65s cubic-bezier(.16,1,.3,1) both;
}
.intro-logo-wrap::before{
  content:"";position:absolute;inset:12% 8%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(28,200,208,.18),transparent 66%);
  filter:blur(22px);
  z-index:-1;
}
.intro-logo{
  display:block;width:100%;height:auto;margin:0 auto;background:transparent;mix-blend-mode:normal;
  filter:drop-shadow(0 18px 32px rgba(0,0,0,.45));
}
.intro-separator{
  width:min(54vw,230px);height:1px;margin:26px auto 18px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.48),transparent);
  transform-origin:center;
  animation:introLine 1.2s .48s ease both;
}
.intro-title{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(42px,12vw,74px);
  font-weight:600;
  line-height:.95;
  letter-spacing:.16em;
  padding-left:.16em;
  color:#fff;
  text-shadow:0 10px 28px rgba(0,0,0,.42);
  animation:introTitleIn 1.05s .58s cubic-bezier(.16,1,.3,1) both;
}
.intro-title span{
  background:linear-gradient(180deg,#fff8d8 0%,#ffd84f 54%,#dcae16 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

body.intro-playing{overflow:hidden}
body.intro-playing .shell,
body.intro-playing .fab,
body.intro-playing .carousel-controls{
  opacity:0;transform:translateY(10px);pointer-events:none;
}
.shell,.fab,.carousel-controls{
  transition:opacity .55s ease,transform .55s ease;
}
body.intro-done .shell,
body.intro-done .fab,
body.intro-done .carousel-controls{
  opacity:1;transform:none;pointer-events:auto;
}

@keyframes introLogoIn{
  0%{opacity:0;transform:scale(.72) translateY(22px)}
  58%{opacity:1;transform:scale(1.045) translateY(0)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes introTitleIn{
  from{opacity:0;transform:translateY(18px) scale(.96)}
  to{opacity:1;transform:none}
}
@keyframes introLine{
  from{opacity:0;transform:scaleX(.1)}
  to{opacity:1;transform:scaleX(1)}
}
@keyframes introAura{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

<script>

const intro=document.getElementById('intro');
let introClosed=document.body.classList.contains('intro-done');
function closeIntro(){
  if(introClosed) return;
  introClosed=true;
  clearTimeout(window.__laChonaIntroTimer);
  window.__laChonaFinishIntro();
}
// Respeta los 3.45 s de la entrada completa desde que comenzó a abrir la página.
const introElapsed=performance.now()-(window.__laChonaIntroStart||performance.now());
if(!introClosed){
  const introRemaining=Math.max(0,3450-introElapsed);
  clearTimeout(window.__laChonaIntroTimer);
  if(introRemaining===0) closeIntro();
  else window.__laChonaIntroTimer=setTimeout(closeIntro,introRemaining);
}
intro.addEventListener('click', closeIntro);
const drawer=document.getElementById('drawer');
const backdrop=document.getElementById('backdrop');
const openMenu=document.getElementById('openMenu');
const closeMenu=document.getElementById('closeMenu');
const slidePill=document.getElementById('slidePill');
const prevPage=document.getElementById('prevPage');
const nextPage=document.getElementById('nextPage');
const menu=document.getElementById('carta');
const cats=[...document.querySelectorAll('.cat')];
const pages=[...document.querySelectorAll('.page')];
let currentIndex=0;

// La portada, el logo y el fondo vienen dentro del HTML.
// El resto se carga después, con un máximo de dos descargas de precarga.
function loadPageImage(index){
  if(index<0 || index>=pages.length) return;
  const img=pages[index].querySelector('.menu-page');
  if(img && img.dataset.src){
    img.loading='eager';
    img.src=img.dataset.src;
    img.removeAttribute('data-src');
  }
  return img;
}
let secondaryReady=false;
function loadNearbyImages(index){
  loadPageImage(index);
  if(secondaryReady || index!==0){
    loadPageImage(index+1);
    loadPageImage(index-1);
  }
}
function settledImage(img){
  return new Promise(resolve=>{
    if(!img || img.complete) return resolve();
    const timer=setTimeout(done,15000);
    function done(){clearTimeout(timer);img.removeEventListener('load',done);img.removeEventListener('error',done);resolve();}
    img.addEventListener('load',done,{once:true});
    img.addEventListener('error',done,{once:true});
  });
}
const cover=pages[0].querySelector('.menu-page');
settledImage(cover).then(async()=>{
  try{if(cover.decode) await cover.decode();}catch(error){}
  secondaryReady=true;
  let next=1;
  async function warm(){
    while(next<pages.length) await settledImage(loadPageImage(next++));
  }
  warm();warm();
});

function setDrawer(v){
  drawer.classList.toggle('open',v);
  backdrop.classList.toggle('open',v);
  document.body.style.overflow=v?'hidden':'';
}
openMenu.onclick=()=>setDrawer(true);
closeMenu.onclick=()=>setDrawer(false);
backdrop.onclick=()=>setDrawer(false);

function updateUI(index){
  loadNearbyImages(index);
  currentIndex=index;
  const page=pages[index];
  const title=page.dataset.title;
  const pageNum=String(index+1).padStart(2,'0');
  slidePill.innerHTML=`<b>${pageNum}</b> / 17`;
  cats.forEach((b,n)=>b.classList.toggle('active',n===index));
  pages.forEach((p,n)=>p.classList.toggle('active',n===index));
  prevPage.disabled=index===0;
  nextPage.disabled=index===pages.length-1;
  prevPage.style.opacity=index===0?'.45':'1';
  nextPage.style.opacity=index===pages.length-1?'.45':'1';
}

let isAnimating=false;
let buttonScrollRAF=0;

function glideTo(left,index){
  cancelAnimationFrame(buttonScrollRAF);

  const start=menu.scrollLeft;
  const distance=left-start;

  // Movimiento más rápido, pero conservando la desaceleración tipo swipe.
  const duration=Math.min(270,Math.max(190,Math.abs(distance)*0.24));
  const startTime=performance.now();

  isAnimating=true;
  menu.classList.add('button-glide');

  function frame(now){
    const t=Math.min(1,(now-startTime)/duration);

    // Desaceleración rápida y natural, similar a un swipe corto.
    const eased=1-Math.pow(1-t,3.4);
    menu.scrollLeft=start+(distance*eased);

    if(t<1){
      buttonScrollRAF=requestAnimationFrame(frame);
    }else{
      menu.scrollLeft=left;
      menu.classList.remove('button-glide');
      isAnimating=false;
      updateUI(index);
    }
  }

  buttonScrollRAF=requestAnimationFrame(frame);
}

function goToIndex(index, smooth=true){
  index=Math.max(0,Math.min(pages.length-1,index));
  loadNearbyImages(index);

  const targetPage=pages[index];
  const targetLeft=targetPage.offsetLeft - ((menu.clientWidth - targetPage.clientWidth) / 2);

  if(isAnimating && smooth) return;

  if(smooth){
    glideTo(targetLeft,index);
  }else{
    cancelAnimationFrame(buttonScrollRAF);
    menu.classList.remove('button-glide');
    menu.scrollTo({left:targetLeft,behavior:'auto'});
    updateUI(index);
  }
}

cats.forEach((b,idx)=>b.onclick=()=>{
  setDrawer(false);
  goToIndex(idx,true);
});

prevPage.onclick=()=>goToIndex(currentIndex-1,true);
nextPage.onclick=()=>goToIndex(currentIndex+1,true);

let scrollTimer;
menu.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    const menuRect=menu.getBoundingClientRect();
    const center=menuRect.left + menuRect.width/2;
    let bestIndex=0;
    let bestDistance=Infinity;
    pages.forEach((page,idx)=>{
      const r=page.getBoundingClientRect();
      const pageCenter=r.left + r.width/2;
      const d=Math.abs(center-pageCenter);
      if(d<bestDistance){bestDistance=d; bestIndex=idx;}
    });
    updateUI(bestIndex);
  },90);
},{passive:true});

const s=document.getElementById('catSearch');
s.oninput=()=>{
  const q=s.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  cats.forEach(b=>{
    const t=b.textContent.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    b.style.display=t.includes(q)?'grid':'none';
  });
};

requestAnimationFrame(()=>setTimeout(()=>goToIndex(0,false),30));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') setDrawer(false);
  if(e.key==='ArrowRight') goToIndex(currentIndex+1,true);
  if(e.key==='ArrowLeft') goToIndex(currentIndex-1,true);
});

// Autoajuste de la hoja al espacio REAL disponible de cada pantalla.
// Conserva la proporción original y solo reduce tamaño si hace falta.
function fitMenuToViewport(){
  const firstImg = document.querySelector('.menu-page');
  if(!firstImg || !menu) return;

  const applyFit = () => {
    const menuRect = menu.getBoundingClientRect();
    if(menuRect.width < 50 || menuRect.height < 50) return;

    // Todas las hojas de la carta usan la proporción 1087 × 1536.
    // No usamos la proporción natural de la primera imagen (17.webp),
    // porque si esa portada tiene otra medida, encoge visualmente las demás hojas.
    const ratio = 1087 / 1536;

    const maxW = Math.max(120, menuRect.width - 6);
    const maxH = Math.max(120, menuRect.height - 4);

    let w = maxW;
    let h = w / ratio;

    if(h > maxH){
      h = maxH;
      w = h * ratio;
    }

    document.documentElement.style.setProperty('--page-w', `${Math.floor(w)}px`);
    document.documentElement.style.setProperty('--page-h', `${Math.floor(h)}px`);

    requestAnimationFrame(() => {
      const targetPage = pages[currentIndex];
      if(targetPage){
        const targetLeft =
          targetPage.offsetLeft -
          ((menu.clientWidth - targetPage.clientWidth) / 2);
        menu.scrollTo({left:targetLeft, behavior:'auto'});
      }
    });
  };

  if(firstImg.complete){
    applyFit();
  }else{
    firstImg.addEventListener('load', applyFit, {once:true});
  }
}

let fitTimer;
function scheduleFit(){
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitMenuToViewport, 80);
}

requestAnimationFrame(()=>setTimeout(fitMenuToViewport,40));
window.addEventListener('load', () => {
  setTimeout(fitMenuToViewport, 80);
  setTimeout(fitMenuToViewport, 350);
});
window.addEventListener('resize', scheduleFit, {passive:true});
window.addEventListener('orientationchange', () => setTimeout(fitMenuToViewport, 180));

if(window.visualViewport){
  window.visualViewport.addEventListener('resize', scheduleFit, {passive:true});
}

// Bloquear zoom accidental en móviles/tablets y Ctrl+rueda en escritorio.
document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturechange', e => e.preventDefault(), {passive:false});
document.addEventListener('gestureend', e => e.preventDefault(), {passive:false});
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
document.addEventListener('wheel', e => {
  if(e.ctrlKey) e.preventDefault();
}, {passive:false});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && ['+','-','=','0'].includes(e.key)){
    e.preventDefault();
  }
});
